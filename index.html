<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>KADENI'S NGANGKRING — Kritik & Saran</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .wrap {
      max-width: 760px;
      margin: auto;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 16px 0 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    .issues {
      display: block;
      margin-top: 12px;
      padding: 14px;
      text-align: center;
      border-radius: 14px;
      background: #f1f5f9;
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
    }

    .info {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="card">

      <div class="logo">☕ KADENI'S NGANGKRING</div>

      <div class="subtitle">
        Kritik, saran, laporan masalah, atau ide untuk membuat tempat ini lebih baik.
      </div>

      <form id="issueForm">

        <label for="nama">Nama</label>
        <input
          type="text"
          id="nama"
          placeholder="Masukkan nama kamu"
          required
        >

        <label for="kategori">Kategori</label>
        <select id="kategori" required>
          <option value="Kritik">Kritik</option>
          <option value="Saran">Saran</option>
          <option value="Bug">Laporan Bug</option>
          <option value="Ide">Ide / Masukan</option>
        </select>

        <label for="judul">Judul</label>
        <input
          type="text"
          id="judul"
          placeholder="Contoh: Tambahkan menu baru"
          required
        >

        <label for="pesan">Kritik / Saran</label>
        <textarea
          id="pesan"
          placeholder="Tuliskan kritik atau saran kamu di sini..."
          required
        ></textarea>

        <button type="submit">
          📩 Kirim Kritik & Saran
        </button>

      </form>

      <a
        class="issues"
        href="https://github.com/oioibi/Kadenis-ngangkring/issues"
        target="_blank"
      >
        📋 Lihat Semua Issues
      </a>

      <div class="info">
        Setelah menekan tombol kirim, kamu akan diarahkan ke GitHub
        untuk membuat Issue. Kamu tetap bisa mengecek dan mengubah isi
        laporan sebelum mengirimkannya.
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById("issueForm");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const nama = document.getElementById("nama").value.trim();
      const kategori = document.getElementById("kategori").value;
      const judul = document.getElementById("judul").value.trim();
      const pesan = document.getElementById("pesan").value.trim();

      const issueTitle =
        `[${kategori}] ${judul}`;

      const issueBody =
`## ${kategori}

**Nama:** ${nama}

### Isi
${pesan}

---
Dikirim melalui halaman KADENI'S NGANGKRING.`;

      const url =
        "https://github.com/oioibi/Kadenis-ngangkring/issues/new" +
        "?title=" + encodeURIComponent(issueTitle) +
        "&body=" + encodeURIComponent(issueBody);

      window.open(url, "_blank");
    });
  </script>

</body>
</html>
